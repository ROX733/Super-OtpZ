name: Admin Python Syntax Check
on:
  push:
    branches:
      - feature/fampay-admin-panel
  workflow_dispatch:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile all Python modules
        run: python -m compileall -q bot.py admin_menu.py gateway_recharge.py manual_recharge.py
